name: Mobile Query Phase 2
on:
  pull_request:
    # 929 uses the dedicated real-SQL workflow; do not repeat successful 140/18/23.
    paths-ignore:
      - '.github/workflows/query-hierarchy-929.yml'
      - '.github/workflows/mobile-query-phase2.yml'
      - 'tools/sqlserver-acceptance/hierarchy-929/**'
      - 'tools/validate-mobile-query-phase2-scope.mjs'
      - 'server/src/scripts/queryHierarchy929*'
      - 'server/src/modules/dataset/datasetPaging*'
      - 'server/src/modules/queryDefinition/queryHierarchy.service.ts'
      - 'server/src/modules/queryDefinition/queryHierarchy.page.ts'
      - 'server/src/modules/queryDefinition/queryHierarchy.testFixture.ts'
      - 'server/src/modules/queryDefinition/queryHierarchy.paging.test.ts'
      - 'docs/mobile-query-phase2.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  change-scope:
    if: github.head_ref == 'feature/mobile-hierarchical-query-phase2-20261117' || github.ref_name == 'feature/mobile-hierarchical-query-phase2-20261117'
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.delta.outputs.server }}
      client: ${{ steps.delta.outputs.client }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: delta
        # PR path filters see the entire PR, including the already-tested UI.
        # Compare the accepted commit instead; only 929's changed server paths
        # are delegated to its real-SQL + affected-regression workflow.
        run: |
          python3 - <<'PY'
          import os, subprocess
          base='f9ac203d6e905ed156b765542cc02d9d2154c20a'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          files=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          delegated={'server/src/modules/dataset/datasetPaging.service.ts','server/src/modules/dataset/datasetPaging.service.test.ts','server/src/modules/queryDefinition/queryHierarchy.service.ts','server/src/modules/queryDefinition/queryHierarchy.page.ts','server/src/modules/queryDefinition/queryHierarchy.testFixture.ts','server/src/modules/queryDefinition/queryHierarchy.paging.test.ts'}
          server=not files or any(p.startswith('server/') and p not in delegated and not p.startswith('server/src/scripts/queryHierarchy929') for p in files)
          client=not files or any(p.startswith('client/') for p in files)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('server='+str(server).lower()+'\nclient='+str(client).lower()+'\n')
          print('Reuse successful f9ac203 evidence; server='+str(server)+', client='+str(client))
          PY
  phase2-server:
    needs: change-scope
    if: needs.change-scope.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: node tools/validate-mobile-query-phase2-scope.mjs
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
        working-directory: server
      - name: Hierarchy, real QueryDelivery masking/audit and existing PIN assurance regression (synthetic only)
        working-directory: server
        run: >-
          node --import tsx --test --test-concurrency=1
          src/modules/dataset/datasetPaging.service.test.ts
          src/modules/queryDefinition/queryHierarchy*.test.ts
          src/modules/queryDefinition/queryDelivery.routes.test.ts
          src/modules/queryDefinition/pinQueryPolicy.test.ts
          src/modules/auth/workstationQuery.routes.test.ts
          src/modules/auth/workstationPin.routes.test.ts
          src/modules/auth/workstationSession.repository.test.ts
      - run: npm run typecheck && npm run build
        working-directory: server
  phase2-client:
    needs: change-scope
    if: needs.change-scope.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: node tools/validate-mobile-query-phase2-scope.mjs
      - run: npm install --global npm@12.2.1
      - run: npm ci
        working-directory: client
      - name: Existing identity fence and request security unit tests
        working-directory: client
        run: node --import tsx --test --experimental-test-isolation=none src/security/*.test.ts
      - run: npm run typecheck && npm run build
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Mobile hierarchy, unchanged Date controls and existing PIN isolation browser regression
        working-directory: client
        run: npx playwright test e2e/query-hierarchy.spec.ts e2e/query-date-formats.spec.ts e2e/workstation-pin-runtime.spec.ts --reporter=line
