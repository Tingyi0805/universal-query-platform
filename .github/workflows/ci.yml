name: CI

on:
  push:
    # PR83 online verification fallback: use push when pull_request events are absent.
    branches: [main, fix/iis-https-kiosk-82]
  pull_request:
  # Manual validation of the selected PR branch, independent of synchronize events.
  workflow_dispatch:

jobs:
  dashboard-ui-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ui_only: ${{ steps.scope.outputs.ui_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate explicitly requested PR83 UI-only scope against the verified baseline
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            const {execFileSync}=require('node:child_process');
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'});
            const baseline='cb73828defbb0aff86f8e6366c75b2fbe8584b24'; // Full CI #1262, including SQL 2019/2022.
            const requested=context.eventName==='pull_request'&&context.payload.pull_request.number===83&&git('log','-1','--format=%B').includes('[ui-only-no-migrations]');
            if(requested){
              const base=context.payload.pull_request.base.sha;
              if(!/^[a-f0-9]{40}$/.test(base))throw Error('UI_ONLY_BASE_INVALID');
              git('merge-base','--is-ancestor',baseline,'HEAD');
              git('merge-base','--is-ancestor',base,baseline);
              const files=git('diff','--name-only','-z',baseline,'HEAD').split('\0').filter(Boolean);
              if(files.some(file=>!file.startsWith('client/')&&!file.startsWith('docs/')&&file!=='.github/workflows/ci.yml'))throw Error('UI_ONLY_SCOPE_REJECTED');
              core.notice('UI-only: verified unchanged Server/SQL baseline; no SQL acceptance, migration, or staging packaging. Server/Client unit, typecheck, build and Browser regression remain required.');
            }
            core.setOutput('ui_only',String(requested));

  device-lifecycle-d1-sql:
    needs: dashboard-ui-scope
    if: needs.dashboard-ui-scope.outputs.ui_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        sql: [2019, 2022]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          # Verify Chart 928 SQL against the actual PR HEAD, not an
          # implicit synthetic PR merge checkout or an older commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact immutable D1 SQL acceptance HEAD
        shell: bash
        working-directory: .
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ ! "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ || "$actual" != "$EXPECTED_HEAD" ]]; then
            echo "D1_SQL_HEAD_SHA_MISMATCH" >&2
            exit 1
          fi
          echo "D1_SQL_ACCEPTANCE_HEAD=$actual SQL_SERVER=${{ matrix.sql }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - name: Create dedicated D1 disposable SQL instance
        shell: bash
        run: |
          set -euo pipefail
          uqp_d1_name="uqp-d1-$(openssl rand -hex 6)"
          uqp_d1_password="D1!$(openssl rand -hex 22)Z"
          echo "::add-mask::$uqp_d1_password"
          echo "UQP_D1_CONTAINER_NAME=$uqp_d1_name" >> "$GITHUB_ENV"
          echo "UQP_D1_SQL_PASSWORD=$uqp_d1_password" >> "$GITHUB_ENV"
          docker run -d --rm --name "$uqp_d1_name" --hostname "$uqp_d1_name" \
            --label uqp.d1.disposable=true -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$uqp_d1_password" \
            -p 127.0.0.1:14336:1433 mcr.microsoft.com/mssql/server:${{ matrix.sql }}-latest >/dev/null
          docker inspect --format '{{.Id}} {{.Config.Hostname}} {{.Config.Image}} {{index .Config.Labels "uqp.d1.disposable"}}' "$uqp_d1_name"
      - name: Verify D1 and D3 production writers in disposable synthetic SQL DB
        env:
          UQP_D1_SCOPE: DISPOSABLE_ONLY
        run: node --import tsx src/scripts/deviceLifecycle926Acceptance.ts
      - name: Destroy only the D1 disposable instance
        if: always()
        shell: bash
        run: |
          if [[ "${UQP_D1_CONTAINER_NAME:-}" =~ ^uqp-d1-[a-f0-9]{12}$ ]]; then
            docker rm -f "$UQP_D1_CONTAINER_NAME" >/dev/null 2>&1 || true
          fi

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install --global npm@12.2.1
      # Linux test jobs do not exercise ODBC native bindings. Keep the
      # separate Windows Node 24 job as the mandatory native-load witness;
      # IBM's Linux prebuilt download can return 504 and source compilation
      # of odbc@2.6.0 is not compatible with this Node 24 CI toolchain.
      - name: Install Linux JavaScript/SQL-test dependencies (no native scripts)
        run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=low
      - name: Run Linux JS-only Server tests (Windows CI runs entire native suite)
        shell: bash
        run: |
          set -euo pipefail
          test -f src/dependencies/dependencyContracts.test.ts
          test -f src/dependencies/zod4Contracts.test.ts
          mapfile -d '' tests < <(find src -type f -name '*.test.ts' \
            ! -path 'src/dependencies/dependencyContracts.test.ts' \
            ! -path 'src/dependencies/zod4Contracts.test.ts' -print0)
          if (( ${#tests[@]} < 100 )); then
            echo 'SERVER_LINUX_JS_TEST_DISCOVERY_INCOMPLETE'
            exit 1
          fi
          echo 'SERVER_LINUX_JS_TESTS=ON; WINDOWS_FULL_NATIVE_TESTS=REQUIRED'
          node --import tsx --test "${tests[@]}"
      - run: npm run typecheck
      - run: npm run build
      - name: Validate offline SQL Schema usage inventory
        run: node ../tools/validate-database-schema-inventory.mjs
      - name: Verify CHART 928 isolated test installer source integrity
        run: node ../tools/validate-chart-928-test-installer.mjs
      - name: Measure tracked source and clean Server build bytes
        run: node ../tools/measure-browser-build.mjs

  client:
    runs-on: ubuntu-24.04
    # Use the exact Playwright 1.64.1 browser and Ubuntu system dependencies
    # from the official test image; do not substitute system Chromium 156 or
    # download APT font packages during CI. This is test-only isolation.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Trust only this checkout for Git metadata reads inside Playwright container
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
      - name: Measure tracked source and Client build bytes
        run: node ../tools/measure-browser-build.mjs
      - name: Install synthetic kiosk API test dependencies (no database/native drivers)
        run: npm ci --prefix ../server --ignore-scripts
      - name: Verify pinned Playwright browser from official container
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('playwright');const fs=require('fs');if(require('playwright/package.json').version!=='1.64.1'||!fs.existsSync(p.chromium.executablePath()))process.exit(1);console.log('CHART_CI_PINNED_BROWSER='+p.chromium.executablePath())"
      - name: Run full Playwright browser regressions with matching browser
        run: npm run test:e2e
      - name: Upload PR88 Client build (TEST ONLY, NOT production deployment)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 88
        uses: actions/upload-artifact@v4
        with:
          name: uqp-pr88-client-test-only-${{ github.sha }}
          path: |
            client/dist/
            client/PR88-TEST-README.txt
          if-no-files-found: error
          retention-days: 14
      - name: Build standalone synthetic chart lab (no API or database)
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/iis-https-kiosk-82'
        run: npm run build:chart-lab
      - name: Upload test-only chart lab (NOT a production update)
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/iis-https-kiosk-82'
        uses: actions/upload-artifact@v4
        with:
          name: uqp-chart-synthetic-lab-NOT-FOR-PRODUCTION-${{ github.sha }}
          path: |
            client/chart-lab-dist/
            client/chart-lab-preview-server.mjs
            client/start-chart-lab.bat
            client/CHART-LAB-README.txt
          if-no-files-found: error
          retention-days: 14

  sql-923-ephemeral:
    # Experimental acceptance only, scoped to the existing Draft PR.
    # No access to user databases or production connection secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 66
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Launch disposable SQL Server 2019
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          pw="S9a!$(openssl rand -hex 20)Z"
          echo "::add-mask::$pw"
          echo "UQP_923_CI_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run -d --rm --name uqp-923-ephemeral --hostname uqp-923-ephemeral \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$pw" \
            -p 127.0.0.1:14333:1433 \
            mcr.microsoft.com/mssql/server:2019-latest >/dev/null
      - name: SQL Server 2019 synthetic 923 DDL / Catalog acceptance
        env:
          UQP_923_CI_EPHEMERAL: "1"
          UQP_923_CI_HOST: "127.0.0.1"
          UQP_923_CI_PORT: "14333"
        run: npx tsx src/scripts/dataset923EphemeralSqlAcceptance.ts
      - name: Destroy disposable SQL Server
        if: always()
        shell: bash
        working-directory: .
        run: docker rm -f uqp-923-ephemeral >/dev/null 2>&1 || true

  sql-924-full-schema:
    # All historical 001-921 migration sources + dedicated 923/924/925 acceptance.
    # PR #99 reuses this exact SQL Server 2019 full-schema path to attest 925;
    # it is a disposable CI database, not user SQL or 928 deployment.
    if: github.event_name == 'pull_request' && (github.event.pull_request.number == 66 || github.event.pull_request.number == 99)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Launch independent full-schema SQL Server 2019
        shell: bash
        run: |
          set -euo pipefail
          pw="F2a!$(openssl rand -hex 20)Z"
          echo "::add-mask::$pw"
          echo "UQP_924_CI_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run -d --rm --name uqp-924-full-schema --hostname uqp-924-full-schema \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$pw" \
            -p 127.0.0.1:14334:1433 \
            mcr.microsoft.com/mssql/server:2019-latest >/dev/null
      - name: Full UQP Schema and 924 restricted-owner acceptance
        env:
          UQP_924_CI_EPHEMERAL: "1"
        run: npx tsx src/scripts/dataset924FullSchemaAcceptance.ts
      - name: Destroy full-schema SQL Server
        if: always()
        shell: bash
        run: docker rm -f uqp-924-full-schema >/dev/null 2>&1 || true

  sql-928-full-schema-2022:
    # PR99: independent SQL Server 2022 disposable full-schema and 928 install.
    # Never points to hospital SQL, and never grants production release approval.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 99
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Launch independent full-schema SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          pw="F2a!$(openssl rand -hex 20)Z"
          echo "::add-mask::$pw"
          echo "UQP_924_CI_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run -d --rm --name uqp-924-full-schema --hostname uqp-924-full-schema \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$pw" \
            -p 127.0.0.1:14334:1433 \
            mcr.microsoft.com/mssql/server:2022-latest >/dev/null
      - name: Full UQP Schema and 928 isolated SQL Server 2022 acceptance
        env:
          UQP_924_CI_EPHEMERAL: "1"
          UQP_924_CI_SQL_MAJOR: "16"
        run: npx tsx src/scripts/dataset924FullSchemaAcceptance.ts
      - name: Destroy full-schema SQL Server 2022
        if: always()
        shell: bash
        run: docker rm -f uqp-924-full-schema >/dev/null 2>&1 || true

  windows-923-installer:
    # Syntax-only; no credentials and no SQL connection.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 66
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify PowerShell 5.1 installer syntax
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $file = (Resolve-Path '.\tools\install-uqp-923.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw '923_WINDOWS_INSTALLER_SYNTAX_INVALID' }
          Write-Host '923_WINDOWS_POWERSHELL_51_SYNTAX_OK'
          $file = (Resolve-Path '.\tools\install-uqp-924.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw '924_WINDOWS_INSTALLER_SYNTAX_INVALID' }
          Write-Host '924_WINDOWS_POWERSHELL_51_SYNTAX_OK'
          $file = (Resolve-Path '.\tools\install-uqp-925.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw '925_WINDOWS_INSTALLER_SYNTAX_INVALID' }
          Write-Host '925_WINDOWS_POWERSHELL_51_SYNTAX_OK'
          $file = (Resolve-Path '.\tools\test-uqp-d0-host.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw 'D0_WINDOWS_INSPECTOR_SYNTAX_INVALID' }
          Write-Host 'D0_WINDOWS_INSPECTOR_SYNTAX_OK'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 924 Windows offline CLI guard tests (no database)
        working-directory: server
        run: |
          npm install
          node --import tsx --test src/scripts/installDataset924.test.ts src/scripts/installDataset925.test.ts

  d0-source-bundle:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 66
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Package tracked sources with SHA-256
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          mkdir -p dist
          file="UQP-PR66-${sha:0:8}-source.zip"
          git archive --format=zip --output="dist/$file" HEAD
          (cd dist && sha256sum "$file" > SHA256SUMS.txt)
          test -s "dist/$file"
          unzip -l "dist/$file" | grep -q 'tools/install-uqp-925.ps1'
          unzip -l "dist/$file" | grep -q 'docs/windows-dataset-display-925-rollout.md'
          if unzip -Z1 "dist/$file" | grep -Ei '(^|/)(\.env($|\.)|node_modules/|\.git/|[^/]+\.(pem|pfx|key)$)' | grep -Ev '(^|/)\.env\.example$'; then
            echo 'BUNDLE_CONTAINS_FORBIDDEN_FILE'
            exit 1
          fi
          echo 'D0_SOURCE_BUNDLE_ONLY_NOT_DEPLOYABLE'
      - uses: actions/upload-artifact@v4
        with:
          name: uqp-pr66-d0-source
          path: dist/
          retention-days: 7
          if-no-files-found: error

  windows-release-candidate:
    if: github.event.pull_request.number == 66
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build server
        shell: pwsh
        run: |
          Set-Location server
          npm install
          if($LASTEXITCODE -ne 0){throw 'SERVER_NPM_CI_FAILED'}
          npm run typecheck
          if($LASTEXITCODE -ne 0){throw 'SERVER_TYPECHECK_FAILED'}
          npm run build
          if($LASTEXITCODE -ne 0){throw 'SERVER_BUILD_FAILED'}
      - name: Build client
        shell: pwsh
        run: |
          Set-Location client
          npm install
          if($LASTEXITCODE -ne 0){throw 'CLIENT_NPM_CI_FAILED'}
          npm run typecheck
          if($LASTEXITCODE -ne 0){throw 'CLIENT_TYPECHECK_FAILED'}
          npm run build
          if($LASTEXITCODE -ne 0){throw 'CLIENT_BUILD_FAILED'}
      - name: Package isolated Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path release/payload/server,release/payload/client,release/payload/tools,release/payload/docs -Force | Out-Null
          Copy-Item server/dist release/payload/server/dist -Recurse
          Copy-Item server/package.json release/payload/server/
          Copy-Item server/src release/payload/server/src -Recurse
          Copy-Item server/tsconfig.json,server/tsconfig.build.json release/payload/server/
          Copy-Item client/dist release/payload/client/dist -Recurse
          Copy-Item client/package.json,client/index.html,client/vite.config.ts,client/tsconfig.json,client/tsconfig.app.json,client/tsconfig.node.json,client/tsconfig.e2e.json release/payload/client/
          Copy-Item client/src release/payload/client/src -Recurse
          if(Test-Path client/package-lock.json){Copy-Item client/package-lock.json release/payload/client/}
          if(Test-Path client/.env.example){Copy-Item client/.env.example release/payload/client/}
          Copy-Item tools/install-uqp-925.ps1,tools/test-uqp-d0-host.ps1 release/payload/tools/
          New-Item -ItemType Directory -Path release/payload/tools/sqlserver-acceptance/drafts/925 -Force | Out-Null
          Copy-Item tools/sqlserver-acceptance/drafts/925/925_dataset_display_policy.sql release/payload/tools/sqlserver-acceptance/drafts/925/
          New-Item -ItemType Directory -Path release/payload/database -Force | Out-Null
          Copy-Item tools/sqlserver-acceptance/drafts/925/925_dataset_display_policy.sql release/payload/database/925_dataset_display_policy.sql
          Copy-Item tools/install-uqp-pr66-offline.ps1,tools/prepare-uqp-pr66-steps1-4.ps1 release/
          Copy-Item docs/windows-dataset-display-925-rollout.md,docs/d0-or001-windows-isolated-acceptance.md,docs/windows-pr66-overwrite-package.md release/payload/docs/
          Copy-Item tools/install-uqp-pr66-offline.ps1 release/
          Set-Location release/payload/server
          npm install --ignore-scripts=false
          if($LASTEXITCODE -ne 0){throw 'WINDOWS_RUNTIME_DEPENDENCIES_FAILED'}
          Set-Location ../../..
          $root=(Resolve-Path release).Path
          $files=Get-ChildItem release/payload -Recurse -File
          $lines=foreach($f in $files){$rel=$f.FullName.Substring($root.Length+1).Replace('\','/');"$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $rel"}
          $lines | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii
          if($files.Count -lt 20){throw 'WINDOWS_RELEASE_INCOMPLETE'}
      - name: Check packaged client can install, build and launch with UQP API proxy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $client='release/payload/client'
          foreach($file in @('package.json','index.html','vite.config.ts','tsconfig.json','src/main.tsx')){
            if(-not (Test-Path (Join-Path $client $file))){throw "UQP_CLIENT_SOURCE_MISSING: $file"}
          }
          if(-not ((Get-Content (Join-Path $client 'vite.config.ts') -Raw) -match 'http://localhost:3200')){throw 'UQP_CLIENT_PROXY_NOT_3200'}
          Push-Location $client
          try {
            npm install --ignore-scripts
            if($LASTEXITCODE -ne 0){throw 'UQP_CLIENT_INSTALL_FAILED'}
            npm run build
            if($LASTEXITCODE -ne 0){throw 'UQP_CLIENT_REBUILD_FAILED'}
          } finally { Pop-Location }
          # Do not ship installed development dependencies: install from package.json after extraction.
          Remove-Item (Join-Path $client 'node_modules') -Recurse -Force
          # Rebuild the checksum manifest after packaging validation, since npm install/build
          # may generate package-lock.json and tsbuildinfo inside payload/client.
          $root=(Resolve-Path release).Path
          $files=Get-ChildItem release/payload -Recurse -File
          $lines=foreach($f in $files){$rel=$f.FullName.Substring($root.Length+1).Replace('\','/');"$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $rel"}
          $lines | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii
          Write-Host 'UQP_CLIENT_SOURCE_INSTALL_REBUILD_PASS'

      - name: Test installer preflight and simulated rollback guard
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'release/install-uqp-pr66-offline.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){throw 'WINDOWS_INSTALLER_SYNTAX_INVALID'}
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'release/prepare-uqp-pr66-steps1-4.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){throw 'WINDOWS_PREPARE_1_TO_4_SYNTAX_INVALID'}
          $testRoot=Join-Path $env:RUNNER_TEMP 'UQP_RC_Test'
          New-Item -ItemType Directory -Path $testRoot -Force|Out-Null
          $target=Join-Path $testRoot 'UQP'
          New-Item -ItemType Directory -Path $target|Out-Null
          'original'|Set-Content (Join-Path $target 'marker.txt')
          & .\release\install-uqp-pr66-offline.ps1 -Target $target -PreflightOnly
          $failed=$false
          try { & .\release\install-uqp-pr66-offline.ps1 -Target $target -Schema925Verified -ServiceStopped -AcceptMaintenance -SimulateFailure } catch {$failed=$true}
          if(-not $failed){throw 'FAILURE_INJECTION_NOT_TRIGGERED'}
          if((Get-Content (Join-Path $target 'marker.txt')) -ne 'original'){throw 'ROLLBACK_GUARD_FAILED'}
          Write-Host 'OFFLINE_FAILURE_GUARD_PASS'
      - name: Compress release candidate and hash
        shell: pwsh
        run: |
          $sha='${{ github.event.pull_request.head.sha }}'
          $name="UQP-PR66-$($sha.Substring(0,8))-Windows-RC.zip"
          Compress-Archive -Path release/* -DestinationPath $name -CompressionLevel Optimal
          (Get-FileHash -Algorithm SHA256 $name).Hash.ToLowerInvariant()+"  "+$name | Set-Content SHA256SUMS-WINDOWS-RC.txt -Encoding ascii
          New-Item -ItemType Directory -Path output|Out-Null
          Move-Item $name output/
          Move-Item SHA256SUMS-WINDOWS-RC.txt output/
      - uses: actions/upload-artifact@v4
        with:
          name: uqp-pr66-windows-release-candidate
          path: output/
          retention-days: 7
          if-no-files-found: error

  windows-kiosk-launcher:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install --global npm@12.2.1
      - name: Install offline generator dependencies without native database drivers
        working-directory: server
        run: npm ci --ignore-scripts
      - name: Verify Windows PowerShell 5.1 launcher syntax and mock launch arguments
        shell: powershell
        run: .\tools\test-uqp-kiosk-launcher.ps1

  windows-node24-dependencies:
    runs-on: windows-latest
    # Existing SQL/source SHA witnesses pin Git's LF bytes; do not rewrite them to CRLF.
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - name: Load Windows native dependencies on Node 24.22.1 ABI 137
        run: node ../tools/test-pr83-node-runtime.mjs .
      - name: Locate OpenSSL for synthetic credential tests
        shell: powershell
        run: |
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $uqp75OpenSsl = Join-Path $env:ProgramFiles 'Git\usr\bin'
            if (-not (Test-Path (Join-Path $uqp75OpenSsl 'openssl.exe'))) { throw 'OPENSSL_TEST_PREREQUISITE_MISSING' }
            $uqp75OpenSsl | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  dependency-sql-smoke:
    needs: dashboard-ui-scope
    if: needs.dashboard-ui-scope.outputs.ui_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install --global npm@12.2.1
      # Linux test jobs do not exercise ODBC native bindings. Keep the
      # separate Windows Node 24 job as the mandatory native-load witness;
      # IBM's Linux prebuilt download can return 504 and source compilation
      # of odbc@2.6.0 is not compatible with this Node 24 CI toolchain.
      - name: Install Linux JavaScript/SQL-test dependencies (no native scripts)
        run: npm ci --ignore-scripts
      - name: Start disposable SQL Server (no user databases or migrations)
        shell: bash
        run: |
          set -euo pipefail
          uqp75_password="D75!$(openssl rand -hex 20)Z"
          echo "::add-mask::$uqp75_password"
          echo "UQP75_SQL_PASSWORD=$uqp75_password" >> "$GITHUB_ENV"
          docker run -d --rm --name uqp75-sql \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$uqp75_password" \
            -p 127.0.0.1:14335:1433 mcr.microsoft.com/mssql/server:2022-latest >/dev/null
      - name: Production adapter connection, typed binds and Excel round trip (SELECT only)
        env:
          UQP75_SQL_SCOPE: EPHEMERAL_CI_ONLY
        run: node --import tsx src/dependencies/sqlServerEphemeral.ts
      - name: Destroy disposable SQL Server
        if: always()
        shell: bash
        run: docker rm -f uqp75-sql >/dev/null 2>&1 || true

  pr83-926-release:
    # A staging artifact, never an authorization to overwrite production or run a migration.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 83 && needs.dashboard-ui-scope.outputs.ui_only != 'true'
    needs: [dashboard-ui-scope, server, client, device-lifecycle-d1-sql, windows-node24-dependencies, windows-kiosk-launcher, dependency-sql-smoke]
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: npm install --global npm@12.2.1
      - name: Bind current PR heads and successful prerequisite jobs
        uses: actions/github-script@v7
        env:
          UQP_RELEASE_NEEDS: ${{ toJSON(needs) }}
          UQP_RELEASE_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs=require('node:fs');
            const [pr83,pr66]=await Promise.all([83,66].map(pull_number=>github.rest.pulls.get({...context.repo,pull_number})));
            if(!pr83.data.draft||pr83.data.merged||pr83.data.head.sha!==process.env.UQP_RELEASE_HEAD)throw Error('PR83_HEAD_MOVED_OR_NOT_DRAFT');
            fs.writeFileSync('release926-evidence.json',JSON.stringify({sourceCommit:pr83.data.head.sha,pr83Draft:true,pr66Head:pr66.data.head.sha,url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,jobs:JSON.parse(process.env.UQP_RELEASE_NEEDS)},null,2));
      - name: Build Windows server and client from locked dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location server
          npm ci
          if($LASTEXITCODE){throw '926_SERVER_INSTALL_FAILED'}
          npm run build
          if($LASTEXITCODE){throw '926_SERVER_BUILD_FAILED'}
          npm prune --omit=dev --ignore-scripts
          if($LASTEXITCODE){throw '926_PRODUCTION_DEPENDENCIES_FAILED'}
          node ../tools/test-pr83-node-runtime.mjs .
          if($LASTEXITCODE){throw '926_NATIVE_RUNTIME_FAILED'}
          Pop-Location
          Push-Location client
          npm ci
          if($LASTEXITCODE){throw '926_CLIENT_INSTALL_FAILED'}
          npm run build
          if($LASTEXITCODE){throw '926_CLIENT_BUILD_FAILED'}
          Pop-Location
      - name: Package matching source, built runtime, SQL resources and checksums
        shell: pwsh
        run: |
          node tools/package-pr83-926.mjs release926 release926-evidence.json
          if($LASTEXITCODE){throw '926_PACKAGE_FAILED'}
      - name: Verify ZIP round trip and Windows PowerShell 5.1 rejection guards
        shell: powershell
        run: .\tools\test-uqp-pr83-926-package.ps1 -PackageRoot .\release926 -ZipPath .\release926.zip
      - name: Recheck latest heads before publishing staging artifact
        uses: actions/github-script@v7
        with:
          script: |
            const e=JSON.parse(require('node:fs').readFileSync('release926-evidence.json','utf8'));
            const [a,b]=await Promise.all([83,66].map(pull_number=>github.rest.pulls.get({...context.repo,pull_number})));
            if(!a.data.draft||a.data.merged||a.data.head.sha!==e.sourceCommit||b.data.head.sha!==e.pr66Head)throw Error('RELEASE_HEAD_CHANGED_REBUILD_REQUIRED');
      - uses: actions/upload-artifact@v4
        with:
          name: uqp-pr83-926-windows-staging-${{ github.event.pull_request.head.sha }}
          path: |
            release926.zip
            release926.zip.sha256
          retention-days: 7
          if-no-files-found: error

  pr88-windows-test-staging:
    # Full Windows test staging, not a production approval or installer.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 88 && needs.dashboard-ui-scope.outputs.ui_only != 'true'
    needs: [dashboard-ui-scope, server, client, device-lifecycle-d1-sql, windows-node24-dependencies, windows-kiosk-launcher, dependency-sql-smoke]
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: read
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: npm install --global npm@12.2.1
      - name: Verify PR88 HEAD, immutable PR83 baseline, Draft status and successful jobs
        uses: actions/github-script@v7
        env:
          UQP_PR88_NEEDS: ${{ toJSON(needs) }}
          UQP_PR88_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs=require('node:fs');
            const [pr88,pr83]=await Promise.all([88,83].map(pull_number=>github.rest.pulls.get({...context.repo,pull_number})));
            const baseline='846483f6b1151eb12468d60369745fe77f0249b7';
            if(!pr88.data.draft||pr88.data.merged||pr88.data.head.sha!==process.env.UQP_PR88_HEAD)throw Error('PR88_HEAD_MOVED_OR_NOT_DRAFT');
            if(!pr83.data.draft||pr83.data.head.sha!==baseline)throw Error('PR83_COMPATIBILITY_BASELINE_CHANGED');
            const jobs=JSON.parse(process.env.UQP_PR88_NEEDS);
            for(const name of ['server','client','device-lifecycle-d1-sql','windows-node24-dependencies','windows-kiosk-launcher','dependency-sql-smoke'])
              if(jobs[name]?.result!=='success')throw Error('PR88_PREREQUISITE_FAILED:'+name);
            fs.writeFileSync('pr88-staging-evidence.json',JSON.stringify({sourceCommit:pr88.data.head.sha,pr88Draft:true,pr83Baseline:baseline,url:'https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId,jobs},null,2));
      - name: Build Windows server and client with locked Node 24.22.1 dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location server
          npm ci
          if($LASTEXITCODE){throw 'PR88_SERVER_INSTALL_FAILED'}
          npm run build
          if($LASTEXITCODE){throw 'PR88_SERVER_BUILD_FAILED'}
          npm prune --omit=dev --ignore-scripts
          if($LASTEXITCODE){throw 'PR88_SERVER_PRODUCTION_DEPENDENCIES_FAILED'}
          node ../tools/test-pr83-node-runtime.mjs .
          if($LASTEXITCODE){throw 'PR88_WINDOWS_NATIVE_RUNTIME_FAILED'}
          Pop-Location
          Push-Location client
          npm ci
          if($LASTEXITCODE){throw 'PR88_CLIENT_INSTALL_FAILED'}
          npm run build
          if($LASTEXITCODE){throw 'PR88_CLIENT_BUILD_FAILED'}
          Pop-Location
      - name: Build PR88 full Windows test staging and per-file SHA-256 manifest
        shell: pwsh
        run: |
          node tools/package-pr88-staging.mjs pr88-staging pr88-staging-evidence.json
          if($LASTEXITCODE){throw 'PR88_STAGING_PACKAGE_FAILED'}
      - name: Verify ZIP, Windows native modules, hashes and tamper rejection
        shell: powershell
        run: .\tools\test-uqp-pr88-staging.ps1 -PackageRoot .\pr88-staging -ZipPath .\pr88-staging.zip
      - name: Recheck PR88 and PR83 heads before publishing staging artifact
        uses: actions/github-script@v7
        with:
          script: |
            const e=JSON.parse(require('node:fs').readFileSync('pr88-staging-evidence.json','utf8'));
            const [pr88,pr83]=await Promise.all([88,83].map(pull_number=>github.rest.pulls.get({...context.repo,pull_number})));
            if(!pr88.data.draft||pr88.data.head.sha!==e.sourceCommit||pr83.data.head.sha!==e.pr83Baseline)throw Error('PR88_OR_PR83_HEAD_CHANGED_REBUILD_REQUIRED');
      - uses: actions/upload-artifact@v4
        with:
          name: uqp-pr88-windows-full-test-staging-${{ github.event.pull_request.head.sha }}
          path: |
            pr88-staging.zip
            pr88-staging.zip.sha256
          retention-days: 14
          if-no-files-found: error

  pr99-chart-windows-test-zip:
    # Isolated synthetic-preview ZIP only. No SQL migration, live UQP or deploy permissions.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 99
    needs: [server, client, sql-924-full-schema, device-lifecycle-d1-sql, windows-node24-dependencies, windows-kiosk-launcher, dependency-sql-smoke]
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: read
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: npm install --global npm@12.2.1
      - name: Require immutable PR99 Draft HEAD and successful isolated checks
        uses: actions/github-script@v7
        env:
          UQP_PR99_HEAD: ${{ github.event.pull_request.head.sha }}
          UQP_PR99_NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const fs=require('node:fs');
            const pr=await github.rest.pulls.get({...context.repo,pull_number:99});
            if(!pr.data.draft||pr.data.merged||pr.data.head.sha!==process.env.UQP_PR99_HEAD)
              throw Error('CHART_PR99_HEAD_OR_DRAFT_CHANGED');
            const jobs=JSON.parse(process.env.UQP_PR99_NEEDS);
            const required=['server','client','sql-924-full-schema','device-lifecycle-d1-sql','windows-node24-dependencies','windows-kiosk-launcher','dependency-sql-smoke'];
            for(const name of required)
              if(jobs[name]?.result!=='success')throw Error('CHART_PR99_PREREQUISITE_FAILED:'+name);
            fs.writeFileSync('pr99-chart-test-evidence.json',JSON.stringify({
              sourceCommit:pr.data.head.sha,pr99Draft:true,
              url:'https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId,jobs,
            },null,2));
      - name: Build Windows x64 Server and Client from exact PR99 HEAD
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location server
          npm ci
          if($LASTEXITCODE){throw 'CHART_PR99_SERVER_INSTALL_FAILED'}
          npm run build
          if($LASTEXITCODE){throw 'CHART_PR99_SERVER_BUILD_FAILED'}
          npm prune --omit=dev --ignore-scripts
          if($LASTEXITCODE){throw 'CHART_PR99_SERVER_PRUNE_FAILED'}
          node ../tools/test-pr83-node-runtime.mjs .
          if($LASTEXITCODE){throw 'CHART_PR99_NATIVE_RUNTIME_FAILED'}
          Pop-Location
          Push-Location client
          npm ci
          if($LASTEXITCODE){throw 'CHART_PR99_CLIENT_INSTALL_FAILED'}
          npm run build
          if($LASTEXITCODE){throw 'CHART_PR99_CLIENT_BUILD_FAILED'}
          Pop-Location
      - name: Produce synthetic-only ZIP with manifest and SHA-256
        shell: pwsh
        run: |
          node tools/package-pr99-chart-test.mjs pr99-chart-test pr99-chart-test-evidence.json
          if($LASTEXITCODE){throw 'CHART_PR99_ZIP_BUILD_FAILED'}
          node tools/verify-pr99-chart-test.mjs pr99-chart-test
          if($LASTEXITCODE){throw 'CHART_PR99_MANIFEST_FAILED'}
      - name: Verify extracted archive and detect tampering
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $temp=Join-Path $env:RUNNER_TEMP ('pr99-chart-test-'+[guid]::NewGuid().ToString('N'))
          try {
            Expand-Archive -LiteralPath pr99-chart-test.zip -DestinationPath $temp
            node tools/verify-pr99-chart-test.mjs $temp
            if($LASTEXITCODE){throw 'CHART_PR99_EXTRACTED_ZIP_INVALID'}
            $file=Join-Path $temp 'payload/client/dist/index.html'
            [IO.File]::AppendAllText($file,'tamper')
            node tools/test-pr99-chart-tamper.mjs $temp
            if($LASTEXITCODE){throw 'CHART_PR99_TAMPER_TEST_FAILED'}
          } finally {
            if(Test-Path -LiteralPath $temp){Remove-Item -LiteralPath $temp -Recurse -Force}
          }
      - name: Recheck PR99 HEAD and Draft status before artifact publication
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const e=JSON.parse(fs.readFileSync('pr99-chart-test-evidence.json','utf8'));
            const pr=await github.rest.pulls.get({...context.repo,pull_number:99});
            if(!pr.data.draft||pr.data.merged||pr.data.head.sha!==e.sourceCommit)
              throw Error('CHART_PR99_HEAD_CHANGED_REBUILD_REQUIRED');
      - uses: actions/upload-artifact@v4
        with:
          name: uqp-pr99-chart-windows-synthetic-test-${{ github.event.pull_request.head.sha }}
          path: |
            pr99-chart-test.zip
            pr99-chart-test.zip.sha256
          retention-days: 14
          if-no-files-found: error
