name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  sql-923-ephemeral:
    # Experimental acceptance only, scoped to the existing Draft PR.
    # No access to user databases or production connection secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 66
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Launch disposable SQL Server 2019
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          pw="S9a!$(openssl rand -hex 20)Z"
          echo "::add-mask::$pw"
          echo "UQP_923_CI_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run -d --rm --name uqp-923-ephemeral --hostname uqp-923-ephemeral \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$pw" \
            -p 127.0.0.1:14333:1433 \
            mcr.microsoft.com/mssql/server:2019-latest >/dev/null
      - name: SQL Server 2019 synthetic 923 DDL / Catalog acceptance
        env:
          UQP_923_CI_EPHEMERAL: "1"
          UQP_923_CI_HOST: "127.0.0.1"
          UQP_923_CI_PORT: "14333"
        run: npx tsx src/scripts/dataset923EphemeralSqlAcceptance.ts
      - name: Destroy disposable SQL Server
        if: always()
        shell: bash
        working-directory: .
        run: docker rm -f uqp-923-ephemeral >/dev/null 2>&1 || true

  sql-924-full-schema:
    # All 48 real 001-921 migration sources + dedicated 923/924 installers. No user DB secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 66
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Launch independent full-schema SQL Server 2019
        shell: bash
        run: |
          set -euo pipefail
          pw="F2a!$(openssl rand -hex 20)Z"
          echo "::add-mask::$pw"
          echo "UQP_924_CI_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run -d --rm --name uqp-924-full-schema --hostname uqp-924-full-schema \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$pw" \
            -p 127.0.0.1:14334:1433 \
            mcr.microsoft.com/mssql/server:2019-latest >/dev/null
      - name: Full UQP Schema and 924 restricted-owner acceptance
        env:
          UQP_924_CI_EPHEMERAL: "1"
        run: npx tsx src/scripts/dataset924FullSchemaAcceptance.ts
      - name: Destroy full-schema SQL Server
        if: always()
        shell: bash
        run: docker rm -f uqp-924-full-schema >/dev/null 2>&1 || true

  windows-923-installer:
    # Syntax-only; no credentials and no SQL connection.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 66
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify PowerShell 5.1 installer syntax
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $file = (Resolve-Path '.\tools\install-uqp-923.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw '923_WINDOWS_INSTALLER_SYNTAX_INVALID' }
          Write-Host '923_WINDOWS_POWERSHELL_51_SYNTAX_OK'
          $file = (Resolve-Path '.\tools\install-uqp-924.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw '924_WINDOWS_INSTALLER_SYNTAX_INVALID' }
          Write-Host '924_WINDOWS_POWERSHELL_51_SYNTAX_OK'
          $file = (Resolve-Path '.\tools\install-uqp-925.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw '925_WINDOWS_INSTALLER_SYNTAX_INVALID' }
          Write-Host '925_WINDOWS_POWERSHELL_51_SYNTAX_OK'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 924 Windows offline CLI guard tests (no database)
        working-directory: server
        run: |
          npm install
          node --import tsx --test src/scripts/installDataset924.test.ts src/scripts/installDataset925.test.ts

  d0-source-bundle:
    # D0 inspection source only: no production secrets, no database connections,
    # no built release, and no permission to publish or deploy.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 66
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Package tracked sources with SHA-256
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          mkdir -p dist
          file="UQP-PR66-${sha:0:8}-source.zip"
          git archive --format=zip --output="dist/$file" HEAD
          (cd dist && sha256sum "$file" > SHA256SUMS.txt)
          test -s "dist/$file"
          unzip -l "dist/$file" | grep -q 'tools/install-uqp-925.ps1'
          unzip -l "dist/$file" | grep -q 'docs/windows-dataset-display-925-rollout.md'
          if unzip -Z1 "dist/$file" | grep -Ei '(^|/)(\.env($|\.)|node_modules/|\.git/|\.pem$|\.pfx$|\.key$)'; then
            echo 'BUNDLE_CONTAINS_FORBIDDEN_FILE'
            exit 1
          fi
          echo "D0_SOURCE_BUNDLE_ONLY_NOT_DEPLOYABLE"
      - uses: actions/upload-artifact@v4
        with:
          name: uqp-pr66-d0-source
          path: dist/
          retention-days: 7
          if-no-files-found: error
